# nginx: 服务前端静态资源 + 反代后端 API/WS (同源, 免 CORS)。
# 上游 backend 由 docker-compose 服务名解析。
#
# 水平扩容 (Phase 2 §6.3/6.4) 的 LB 骨架:
#  - least_conn: 按最少连接分发, 适合推理这种长耗时不均的请求。
#  - max_fails/fail_timeout: 被动健康摘除 —— 某后端连续失败即在窗口内短路跳过,
#    冷却后自动恢复探测 (满足 §6.6 "杀掉一个实例, 请求不中断")。
#  - 同机多副本: docker compose up -d --scale backend=N 时, 服务名 backend 由
#    docker DNS 解析为多条 A 记录; web 在 backend 之后启动 (depends_on), nginx
#    启动时即把全部副本 IP 加入池。注意单 GPU 共享算力, QPS 不会线性提升,
#    此模式仅用于演示故障摘除 / 不中断; 真扩容需加 GPU 机器 (见下方跨实例占位)。
upstream backend {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=15s;        # 本机 backend (同机 docker DNS)

    # ---- 跨实例扩容占位 ----
    # 新增 backend-only 节点时, 在同一 VPC/专线内开放宿主机 8000 给入口机访问,
    # 再取消下一行注释并替换为你的内网主机名/IP。不要把 backend 8000 暴露到公网。
    # server <PRIVATE_BACKEND_HOST>:8000 max_fails=3 fail_timeout=15s;
}

# 语音聊天 (/ws/chat, Phase 3 speech-to-speech): 默认走本机 backend。
# 如多节点都配置了 AGENT_ENDPOINT/AGENT_API_KEY 且具备出网能力, 可按 backend upstream
# 的方式追加你的私有 backend 节点。
upstream backend_chat {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=15s;        # 本机 backend (同机 docker DNS)
    # server <PRIVATE_BACKEND_HOST>:8000 max_fails=3 fail_timeout=15s;
}

# 注: 实时录音 WS (/ws/asr) 与模型发现 (/api/v1/models) 走 backend upstream。
# 单机部署只含本机 backend; 多节点部署时按上方占位追加私有 backend 节点。

# HTTP: 整体 301 跳转到 HTTPS (浏览器麦克风/getUserMedia 需要安全上下文)。
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS: 前端 + 反代主入口。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签证书或正式证书; 由 compose 挂载 ./certs -> /etc/nginx/certs。
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端 SPA
    root /usr/share/nginx/html;
    index index.html;

    # 音频上传可能较大, 放宽限制 (与后端 max_upload_bytes 对齐)
    client_max_body_size 64m;

    # 健康检查
    location = /healthz { proxy_pass http://backend; }
    location = /readyz  { proxy_pass http://backend; }

    # REST API (含 /api/v1/models 模型发现): 走 backend upstream。
    # Chat 能力目录必须和 /ws/chat 命中同一 Provider 池；否则部分节点未配置
    # 原生 Provider 时，前端会随机看不到 native 模式。
    location = /api/v1/chat/models {
        proxy_pass http://backend_chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 后端连接失败/5xx 时自动切换到池中下一个实例 (故障不中断)。
        # 仅对幂等读重试; 非幂等 (POST 推理) 仅在"连接未建立"阶段重试, 避免重复执行。
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # 语音聊天 WS (/ws/chat): 走 backend_chat upstream。
    # 必须置于通配 /ws/ 块之前: nginx 前缀匹配取最长, /ws/chat 比 /ws/ 更具体, 命中此块。
    location = /ws/chat {
        proxy_pass http://backend_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket (流式 TTS + 实时 ASR): 走 backend upstream。
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
