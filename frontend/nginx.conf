# nginx: 服务前端静态资源 + 反代后端 API/WS (同源, 免 CORS)。
# 上游 backend 由 docker-compose 服务名解析。
upstream backend {
    server backend:8000;
}

# HTTP: 整体 301 跳转到 HTTPS (浏览器麦克风/getUserMedia 需要安全上下文)。
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS: 前端 + 反代主入口。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签证书 (SAN 含实例公网 IP); 由 compose 挂载 ./certs -> /etc/nginx/certs。
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端 SPA
    root /usr/share/nginx/html;
    index index.html;

    # 音频上传可能较大, 放宽限制 (与后端 max_upload_bytes 对齐)
    client_max_body_size 64m;

    # 健康检查
    location = /healthz { proxy_pass http://backend; }
    location = /readyz  { proxy_pass http://backend; }

    # REST API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket (流式 ASR / TTS)
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
