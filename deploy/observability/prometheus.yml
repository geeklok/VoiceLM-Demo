# Prometheus 抓取配置 (Phase 3 §7.3)。仅监控网络内可达, 不对公网开放。
# 入口机上运行: 经 docker DNS 抓本机 backend:8000/metrics; 经 VPC 内网抓 node2。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: asr-backend
    metrics_path: /metrics
    static_configs:
      # node1 (入口机本机 backend): 与 nginx 同一 docker 网络, 用服务名解析。
      - targets: ["backend:8000"]
        labels:
          node: node1
      # node2 (扩展机 backend-only): VPC 内网直达, 由其 override 发布到 10.0.0.12:8000。
      - targets: ["10.0.0.12:8000"]
        labels:
          node: node2

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
