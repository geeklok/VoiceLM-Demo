# Prometheus 抓取配置 (Phase 3 §7.3)。仅监控网络内可达, 不对公网开放。
# 与应用容器同机运行: 经 docker DNS 抓本机 backend:8000/metrics。
# 多节点部署时, 可在 static_configs 下追加自己的私有 backend 节点。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: asr-backend
    metrics_path: /metrics
    static_configs:
      # 本机 backend: 与 nginx 同一 docker 网络, 用服务名解析。
      - targets: ["backend:8000"]
        labels:
          node: primary
      # 示例: 追加扩展机 backend-only 节点 (请替换为自己的私有主机/IP, 不要暴露公网)。
      # - targets: ["<PRIVATE_BACKEND_HOST>:8000"]
      #   labels:
      #     node: node2

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
