# 公网 MVP 部署编排: backend(GPU) + web(nginx 反代 + 静态资源)
# 用法 (在阿里云 GPU ECS 上, 仓库根目录):
#   cp deploy/.env.deploy.example deploy/.env.deploy   # 按需修改
#   docker compose -f deploy/docker-compose.yml up -d --build
# 访问: http://<实例公网IP>
#
# 水平扩容 (Phase 2 §6.3): backend 无固定 container_name, 可同机多副本:
#   docker compose -f deploy/docker-compose.yml up -d --scale backend=2
# 服务名 backend 由 docker DNS 解析为多条 A 记录, nginx upstream (least_conn +
# 被动健康摘除) 在多副本间分发并在某副本挂掉时自动摘除。注意单 GPU 共享算力,
# 多副本仅用于演示故障不中断, QPS 不会线性提升; 真扩容需加 GPU 机器并在
# frontend/nginx.conf 的 upstream 填入各实例 IP。
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: asr-tts-backend:latest
    env_file:
      - .env.deploy
    volumes:
      # 模型权重与参考音色: 在宿主机准备后挂载进容器, 不打进镜像
      - ./models:/models:ro
      - ./voices:/voices:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 仅内部网络可达, 不直接暴露端口 (由 web 反代)
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: asr-tts-web:latest
    ports:
      # 80 -> 301 跳转到 443; 443 为 HTTPS 主入口。安全组需放行 TCP 80 与 443。
      - "80:80"
      - "443:443"
    volumes:
      # 自签证书 (宿主机 deploy/certs 下生成 server.crt/server.key), 只读挂载
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
